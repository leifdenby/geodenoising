# Install the locked environment with uv and run the tests (CPU only)

name: geodenoising

on:
  push:
    branches: [ main ]
  # all pull requests, including ones stacked on other feature branches
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v10.4.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      # torch comes from the PyTorch CPU index (see pyproject.toml)
      run: uv sync --locked --no-default-groups --group test

    - name: Test package with pytest
      run: uv run --locked --no-default-groups --group test pytest
