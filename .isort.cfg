# Moved from setup.cfg. Kept out of pyproject.toml because the isort pinned in
# .pre-commit-config.yaml (5.10.1) can't parse pyproject.toml's
# [dependency-groups] (a TOML 1.0 mixed-type array) and would silently fall
# back to its default settings.
[settings]
profile = black
skip_gitignore = true
force_to_top = true
default_section = THIRDPARTY
known_first_party = convml_data
